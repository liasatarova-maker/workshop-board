<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Табло цеха</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="board">
    <header class="board-header">
      <div>
        <p class="eyebrow">Производство</p>
        <h1>Табло цеха</h1>
      </div>
      <div id="connectionStatus" class="connection-status">Подключение…</div>
    </header>

    <section class="columns">
      <section class="panel panel--new">
        <div class="panel-header">
          <h2>Новые заказы</h2>
          <span id="newCount" class="count">0</span>
        </div>
        <div id="newOrders" class="orders-list"></div>
        <p id="newEmpty" class="empty-state">Новых заказов пока нет</p>
      </section>

      <section class="panel panel--completed">
        <div class="panel-header">
          <h2>Завершённые</h2>
          <span id="completedCount" class="count">0</span>
        </div>
        <div id="completedOrders" class="orders-list"></div>
        <p id="completedEmpty" class="empty-state">Завершённых заказов пока нет</p>
      </section>
    </section>
  </main>

  <template id="newOrderTemplate">
    <article class="order-card">
      <div class="order-card__main">
        <div class="order-number"></div>
        <h3 class="order-title"></h3>
        <div class="order-details">
          <div class="order-dimensions"></div>
          <div class="order-deadline"></div>
        </div>
        <time class="order-time"></time>
      </div>
      <button class="complete-button" type="button">Готово</button>
    </article>
  </template>

  <template id="completedOrderTemplate">
    <article class="order-card order-card--completed">
      <div class="order-card__main">
        <div class="order-number"></div>
        <h3 class="order-title"></h3>
        <div class="order-details">
          <div class="order-dimensions"></div>
          <div class="order-deadline"></div>
        </div>
        <time class="order-time"></time>
      </div>
      <div class="completed-mark" aria-label="Завершено">✓</div>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
